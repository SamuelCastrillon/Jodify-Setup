# Openspec Configuration
schema: spec-driven

context: |
  Tech stack: Go 1.23, spf13/cobra v1.10.2, Lua (Neovim config)
  Architecture: Clean Architecture (cmd → internal → pkg)
  Testing: Go testing (*_test.go)
  Style: go fmt, go vet, GoReleaser
  Platform: Windows (Scoop) + macOS (Brew)
  Distribution: GitHub Releases con GoReleaser

mode: hybrid

rules:
  proposal:
    - Incluir rollback plan para cambios riesgosos
    - Identificar módulos/paquetes afectados
  specs:
    - Usar formato Given/When/Then para escenarios
    - Usar palabras clave RFC 2119 (MUST, SHALL, SHOULD, MAY)
  design:
    - Incluir diagramas de secuencia para flujos complejos
    - Documentar decisiones de arquitectura con rationale
  tasks:
    - Agrupar tareas por fase (infraestructura, implementación, testing)
    - Usar numeración jerárquica (1.1, 1.2, etc.)
    - Mantener tareas suficientemente pequeñas para completar en una sesión
  apply:
    - Seguir patrones de código existentes y convenciones del proyecto
    - Cargar skills relevantes para el stack del proyecto
  verify:
    - Ejecutar tests si existe infraestructura de testing
    - Comparar implementación contra cada escenario del spec
  archive:
    - Advertir antes de merges destructivos (eliminaciones grandes)