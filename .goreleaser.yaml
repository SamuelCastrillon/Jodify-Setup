# This file is used by GoReleaser to build and release the project.
# Learn more about GoReleaser at https://goreleaser.com

version: 2

project_name: jodify-setup

# Build configuration
builds:
  - id: jodify-setup
    binary: jodify-setup
    main: ./cmd/jodify-setup

    # Build targets
    goos:
      - windows
      - darwin

    goarch:
      - amd64
      - arm64

    # Build flags
    ldflags:
      - -s -w
      - -X github.com/SamuelCastrillon/Jodify-Setup/pkg/version.Version={{.Version}}
      - -X github.com/SamuelCastrillon/Jodify-Setup/pkg/version.Commit={{.Commit}}
      - -X github.com/SamuelCastrillon/Jodify-Setup/pkg/version.Date={{.Date}}

# Archive configuration
archives:
  # Binary archives (one per platform)
  - id: binary
    format: zip
    builds:
      - jodify-setup

  # Config archive (single, platform-independent)
  - id: config
    format: zip
    name_template: "jodify-config-{{.Version}}"
    files:
      - src: config/
        dst: config/

# Release configuration
release:
  github:
    owner: SamuelCastrillon
    name: Jodify-Setup
  draft: false
  prerelease: auto
  name_template: "Jodify Setup {{.Tag}}"

# Changelog configuration
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
